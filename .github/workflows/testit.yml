# Ajaa pelin testit jokaisesta muutoksesta, jotta rikkinäinen versio
# huomataan heti. EI julkaise sivua — julkaisusta huolehtii GitHub Pages
# suoraan main-haarasta (Settings → Pages → Deploy from a branch).

name: Testit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Aja pelin testit
        run: node testit/testit.js
