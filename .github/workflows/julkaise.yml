# Julkaisee pelin GitHub Pagesiin osoitteeseen
# https://antsub.github.io/tavupeli/ aina kun main-haaraan tulee muutos.
#
# Työ on jaettu kahtia tarkoituksella: Pages KYTKETÄÄN PÄÄLLE
# ensimmäisessä työssä, koska toisen työn "environment: github-pages"
# on olemassa vasta sen jälkeen. Jos molemmat olisivat samassa työssä,
# työ kaatuisi ympäristön puutteeseen ennen kuin ehtisi luoda sen.

name: Julkaise peli

on:
  push:
    branches: [main]
  workflow_dispatch:        # voidaan ajaa myös käsin Actions-välilehdeltä

permissions:
  contents: read
  pages: write
  id-token: write

# Yksi julkaisu kerrallaan; kesken oleva ei keskeydy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  valmistele:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aja pelin testit
        run: node testit/testit.js

      - name: Ota Pages käyttöön ja määritä se
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pakkaa pelin tiedostot
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  julkaise:
    needs: valmistele
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - name: Julkaise Pagesiin
        id: julkaisu
        uses: actions/deploy-pages@v4
