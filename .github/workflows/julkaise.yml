# Julkaisee pelin GitHub Pagesiin osoitteeseen
# https://antsub.github.io/tavupeli/ aina kun main-haaraan tulee muutos.
#
# Työnkulku myös KYTKEE Pagesin päälle itse (configure-pages: enablement),
# joten asetuksia ei tarvitse käydä säätämässä käsin.

name: Julkaise peli

on:
  push:
    branches: [main]
  workflow_dispatch:        # voidaan ajaa myös käsin Actions-välilehdeltä

permissions:
  contents: read
  pages: write
  id-token: write

# Yksi julkaisu kerrallaan; kesken oleva ei keskeydy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Aja pelin testit
        run: node testit/testit.js

  julkaise:
    needs: testaa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ota Pages käyttöön ja määritä se
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pakkaa pelin tiedostot
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Julkaise
        id: julkaisu
        uses: actions/deploy-pages@v4
